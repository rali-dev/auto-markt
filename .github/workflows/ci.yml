name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      # Der PrismaService liest DATABASE_URL per getOrThrow und bricht den Boot
      # ab, wenn sie fehlt. Die .env liegt zu Recht nicht im Repository, also
      # muss der Runner den Wert stellen -- sonst startet die App nicht und der
      # e2e-Test laeuft in den waitForPortOpen-Timeout.
      #
      # Bewusst ein Platzhalter statt eines Secrets: Der e2e-Test ruft nur
      # GET /api und fasst die Datenbank nicht an. Der pg-Driver-Adapter
      # verbindet sich zudem erst beim ersten Query, die URL wird also nie
      # benutzt. Sobald e2e-Tests echte Daten brauchen, gehoert hier ein
      # postgres-Service-Container hin, kein Zugang zur Supabase-Instanz.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      # Cache node_modules
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      - run: npx nx record -- npx nx format:check --base="remotes/origin/main"
      - run: npx nx run-many -t lint test build typecheck e2e
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/docs/features/ci-features/self-healing-ci
      - run: npx nx fix-ci
        if: always()
